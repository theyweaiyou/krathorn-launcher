<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-app-region: drag; user-select: none;
  }
  .splash {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #14142e 0%, #0a0a1a 100%);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.06) inset;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; width: 320px; height: 320px; border-radius: 50%;
    background: radial-gradient(circle, rgba(107,70,193,0.42) 0%, transparent 65%);
    filter: blur(40px);
    animation: breathe 2.4s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100%{opacity:.55;transform:scale(1);} 50%{opacity:1;transform:scale(1.15);} }
  .content { position: relative; text-align: center; z-index: 1; }
  .diamond {
    display: inline-block; font-size: 56px; color: #a58aff;
    filter: drop-shadow(0 0 24px rgba(107,70,193,0.9));
    animation: spinIn 900ms cubic-bezier(0.34,1.56,0.64,1) forwards; opacity: 0;
  }
  @keyframes spinIn { 0%{opacity:0;transform:rotate(-180deg) scale(.4);} 100%{opacity:1;transform:rotate(0) scale(1);} }
  .title, .version { opacity: 0; animation: fadeUp 700ms ease forwards; }
  .title { margin-top: 12px; font-size: 13px; font-weight: 700; letter-spacing: 6px; color: #d5c7f0; animation-delay: 400ms; }
  .version { margin-top: 10px; font-size: 10px; color: #7a6fa0; letter-spacing: 1px; animation-delay: 600ms; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body>
  <div class="splash">
    <div class="glow"></div>
    <div class="content">
      <div class="diamond">◆</div>
      <div class="title">KRATHORN LAUNCHER</div>
      <div class="version" id="splash-version">v1.2</div>
    </div>
  </div>
  <script>
    (function () {
      try {
        const v = new URLSearchParams(location.search).get('v');
        if (v) document.getElementById('splash-version').textContent = 'v' + v;
      } catch (_) {}
    })();
  </script>
</body>
</html>
