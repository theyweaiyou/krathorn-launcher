<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Krathorn Launcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo-mark" aria-hidden="true">◆</span>
      <span class="brand-text">KRATHORN</span>
    </div>

    <div id="accounts" class="accounts-scroll" role="tablist" aria-label="Accounts">
      <div class="skeleton-chip"></div>
      <div class="skeleton-chip"></div>
      <div class="skeleton-chip"></div>
    </div>

    <div class="spacer"></div>

    <button id="panel-btn" class="icon-btn" title="Accounts & Shortcuts (⌘/)" aria-label="Toggle accounts and shortcuts panel">⌘</button>
    <button id="add-btn" class="icon-btn add-btn" title="Add (⌘N)" aria-label="Add account"><span class="plus" aria-hidden="true">+</span></button>
    <button id="reload-btn" class="icon-btn" title="Reload (⌘R)" aria-label="Reload current account">⟳</button>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Open settings">⚙</button>
  </header>

  <div id="banner" class="banner hidden">
    <span class="banner-dot"></span>
    <span class="banner-version" id="banner-version">v1.2</span>
    <span class="banner-message" id="banner-message"></span>
    <button id="banner-close" class="banner-close" title="Dismiss" aria-label="Dismiss banner">×</button>
  </div>

  <main id="game-area">
    <div id="game-card"></div>

    <div id="transition-veil" class="transition-veil">
      <div class="veil-diamond" aria-hidden="true">◆</div>
      <div class="veil-text">Loading…</div>
    </div>

    <div class="empty-state">
      <div class="empty-glow"></div>
      <div class="empty-icon" aria-hidden="true">✦</div>
      <h2>Welcome to Krathorn Launcher</h2>
      <p>Add an account to begin. Each account runs in its own isolated session.</p>
      <button id="empty-add-btn" class="btn-primary">Add account</button>
    </div>
  </main>

  <aside id="hotkey-panel" class="hotkey-panel hidden" aria-label="Accounts and shortcuts">
    <div class="hk-header">
      <span class="hk-title">Accounts &amp; Shortcuts</span>
      <button id="hk-close" class="hk-close" title="Close" aria-label="Close panel">×</button>
    </div>
    <div id="hotkey-rows" class="hk-rows"></div>
  </aside>

  <footer id="footer">
    2026 — <a href="https://krathorn.com/" id="footer-site">Krathorn</a>
  </footer>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <h3 id="modal-title">Add</h3>
      <label class="modal-field" id="modal-name-field">
        <span>Name</span>
        <input id="modal-input" type="text" placeholder="Account name" autocomplete="off" />
      </label>
      <label class="modal-field" id="modal-proxy-field">
        <span>Proxy (optional)</span>
        <input id="modal-proxy" type="text" placeholder="http://user:pass@host:port or socks5://host:port" autocomplete="off" />
      </label>
      <label class="modal-checkbox-row" id="modal-keep-active-row">
        <span>Keep active in background (higher CPU)</span>
        <input type="checkbox" id="modal-keep-active" />
      </label>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn-secondary">Cancel</button>
        <button id="modal-ok" class="btn-primary">Save</button>
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-box">
      <h3 id="confirm-title">Confirm</h3>
      <p id="confirm-message" class="confirm-message"></p>
      <div class="modal-actions">
        <button id="confirm-cancel" class="btn-secondary">Cancel</button>
        <button id="confirm-ok" class="btn-danger">Confirm</button>
      </div>
    </div>
  </div>

  <div id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="modal-box settings-box">
      <h3 id="settings-title">Settings</h3>
      <label class="setting-row"><span>Sound effects</span><input type="checkbox" id="setting-sound" /></label>
      <label class="setting-row">
        <span>Theme</span>
        <select id="setting-theme">
          <option value="midnight">Midnight</option>
          <option value="light">Light</option>
        </select>
      </label>
      <div class="modal-actions">
        <button id="settings-close" class="btn-primary">Done</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="renderer.js"></script>
</body>
</html>
